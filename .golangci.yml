version: "2"

# Kept deliberately small. gosec, govulncheck and dependency review run in
# their own workflow, so this file covers correctness and clarity instead of
# repeating the security scans.
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # every HTTP response body in this package must be closed
    - errorlint # the API wraps errors, so %w and errors.As must be used right
    - misspell
    - nilerr # returning nil after checking err != nil is always a bug here
    - noctx # every request this client makes takes a context
    - revive
    - unconvert
    - usestdlibvars # http.MethodGet and friends instead of bare strings

  settings:
    revive:
      rules:
        # Every exported symbol needs a doc comment: they are the API
        # reference on pkg.go.dev. Stuttering names such as disk.DiskLogger
        # are allowed, since renaming them would break callers.
        - name: exported
          arguments:
            - disableStutteringCheck

  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # Tests may ignore errors from fixtures and close bodies loosely.
      - path: _test\.go$
        linters:
          - bodyclose
          - errcheck
          - noctx
      # Examples are teaching material. Helpers there are deliberately
      # unused, and spelling things out beats being terse.
      - path: examples[\\/]
        linters:
          - errcheck
          - revive
          - staticcheck
          - unused

formatters:
  enable:
    - gofmt
